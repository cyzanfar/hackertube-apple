name: HackerTube
options:
  bundleIdPrefix: com.cyzanfar.hackertube
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HackerTube
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
targets:
  HackerTube:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyzanfar.hackertube.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  HackerTubeTV:
    type: application
    platform: tvOS
    sources: [Shared, tvOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyzanfar.hackertube.tv
        PRODUCT_NAME: HackerTube
        TARGETED_DEVICE_FAMILY: "3"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
